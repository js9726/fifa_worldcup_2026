name: Sync World Cup Results

on:
  schedule:
    # Every 6 hours — catches end-of-day North American matches plus earlier kickoffs.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Sync results to Neon
        run: npm run sync:results
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
