name: Sync World Cup Results

on:
  schedule:
    # Near-real-time polling. Avoid :00 because scheduled workflows are often delayed there.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-world-cup-results
  cancel-in-progress: true

jobs:
  sync-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      # Lenient install (not `npm ci`): the repo's lock file is missing some
      # platform-optional transitive deps, and this job only needs `postgres`.
      - run: npm install --no-audit --no-fund

      - name: Validate ranking logic
        run: npm run sync:results -- --selftest

      - name: Sync results to Neon
        run: npm run sync:results
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

      - name: Sync trusted AH odds to Neon
        run: npm run sync:odds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPORTSDATAIO_API_KEY: ${{ secrets.SPORTSDATAIO_API_KEY }}
          SPORTSDATAIO_COMPETITION_ID: ${{ vars.SPORTSDATAIO_COMPETITION_ID }}
          SPORTSDATAIO_ODDS_URL: ${{ vars.SPORTSDATAIO_ODDS_URL }}
          SPORTSDATAIO_BOOKMAKER: ${{ vars.SPORTSDATAIO_BOOKMAKER }}
